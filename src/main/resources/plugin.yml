name: MorniDuels
version: '${project.version}'
main: net.morni.duels.DuelsPlugin
api-version: '1.21'
description: Duels für das Netzwerk morni.net – 1 gegen 1 und 2 gegen 2, Klassisch, Modern und Fähigkeiten.
authors: [morni.net]
website: https://morni.net
# Läuft mit dem Netzwerk-Plugin (Sprache, Party, Statistik) und auch allein.
softdepend: [MorniNet]

commands:
  duel:
    description: Jemanden zum Duell herausfordern / Herausforderung annehmen oder ablehnen
    usage: /duel <spieler> [klassisch|modern|fähigkeiten] · /duel annehmen|ablehnen [spieler]
    aliases: [duell, herausfordern]
  spectate:
    description: Einem Kampf zuschauen
    usage: /spectate <spieler>
    aliases: [zuschauen, spec]
  verlassen:
    description: Warteschlange, Kampf oder Zuschauen verlassen (im Kampf zählt es als Niederlage)
    usage: /verlassen
    aliases: [leave, aufgeben]
  stats:
    description: Statistik ansehen
    usage: /stats [spieler]
    aliases: [statistik]
  top:
    description: Rangliste einer Kampfart
    usage: /top [klassisch|modern|fähigkeiten]
    aliases: [rangliste]
  kit:
    description: Kit-Editor öffnen
    usage: /kit [klassisch|modern|bergfuehrer|schmied|kraeuterfrau|jaeger]
    aliases: [kiteditor, kits]
  warteschlange:
    description: Gegner suchen
    usage: /warteschlange <klassisch|modern|fähigkeiten> <locker|gewertet> <1v1|2v2> · /warteschlange verlassen
    aliases: [queue, suchen]
  duels:
    description: Verwaltung (info, neubauen, neuladen)
    usage: /duels <info|neubauen|neuladen>
    permission: morninet.duels.admin

permissions:
  morninet.duels.admin:
    description: Duels verwalten und im Kreativmodus in der Duels-Welt bauen
    default: op
